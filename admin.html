<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSLR | Admin Panel</title>
    <style>
      body { background-color: #050505; color: #fff; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
      .admin-container { background: rgba(255, 255, 255, 0.05); padding: 3rem; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; width: 100%; max-width: 400px; }
      h1 { font-family: 'Space Grotesk', sans-serif; text-align: center; letter-spacing: -0.05em; }
      input { width: 100%; padding: 10px; margin: 10px 0; background: transparent; border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px; box-sizing: border-box; }
      button { width: 100%; padding: 12px; background: white; color: black; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px; }
      button:hover { background: #ddd; }
      .hidden { display: none; }
      #message { margin-top: 15px; font-size: 0.9em; text-align: center; }
    </style>
  </head>
  <body>
    <div class="admin-container" id="login-panel">
      <h1>OSLR.SYS // LOGIN</h1>
      <input type="password" id="password" placeholder="Enter Master Password" />
      <button id="login-btn">ACCESS</button>
      <div id="login-message" style="color: #ff4444; margin-top:10px; text-align:center;"></div>
    </div>

    <div class="admin-container hidden" id="dashboard-panel">
      <h1>ADD PROJECT</h1>
      <input type="text" id="p-title" placeholder="Project Title (e.g. NEON)" />
      <input type="text" id="p-role" placeholder="Role (e.g. WebGL Experience)" />
      <input type="text" id="p-image" placeholder="Image URL (e.g. /src/assets/neon.png)" />
      <button id="submit-btn">UPLOAD TO VOID</button>
      <div id="message"></div>
      <a href="/" style="display:block; text-align:center; margin-top: 20px; color:#888; text-decoration:none; font-size:0.8em;">Return to Matrix</a>
    </div>

    <script>
      let jwtToken = '';

      document.getElementById('login-btn').addEventListener('click', async () => {
        const password = document.getElementById('password').value;
        const res = await fetch('http://localhost:3000/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (data.token) {
          jwtToken = data.token;
          document.getElementById('login-panel').classList.add('hidden');
          document.getElementById('dashboard-panel').classList.remove('hidden');
        } else {
          document.getElementById('login-message').innerText = 'Access Denied.';
        }
      });

      document.getElementById('submit-btn').addEventListener('click', async () => {
        const title = document.getElementById('p-title').value;
        const role = document.getElementById('p-role').value;
        const image = document.getElementById('p-image').value;

        const res = await fetch('http://localhost:3000/api/projects', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${jwtToken}`
          },
          body: JSON.stringify({ title, role, image })
        });
        
        if(res.ok) {
          document.getElementById('message').innerText = 'Project Successfully Added.';
          document.getElementById('message').style.color = '#44ff44';
          document.getElementById('p-title').value = '';
          document.getElementById('p-role').value = '';
          document.getElementById('p-image').value = '';
        } else {
          document.getElementById('message').innerText = 'Error adding project.';
          document.getElementById('message').style.color = '#ff4444';
        }
      });
    </script>
  </body>
</html>
